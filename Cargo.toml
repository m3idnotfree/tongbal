[workspace]
resolver = "3"
members = ["tongbal-api", "tongbal-oauth", "tongbal-types"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
asknothingx2-http = "0.2.2"
asknothingx2-util = "0.5.0"
chrono = "0.4.44"
http = "1.5.0"
reqwest = "0.13.2"
serde = "1.0.228"
serde_json = "1.0.149"
serde_path_to_error = "0.1.20"
thiserror = "2.0.18"
tongbal-types = { path = "tongbal-types", version = "=0.1.0" }
tower-layer = "0.3.3"
url = "2.5.8"
