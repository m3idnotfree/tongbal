[package]
name = "auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.102"
asknothingx2-util = { version = "0.5.0", features = ["oauth-server"] }
axum = "0.8.8"
axum-extra = { version = "0.12.5", features = ["cookie", "typed-header"] }
dotenvy = "0.15.7"
time = "0.3.45"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread"] }
tongbal-oauth = { path = "../../tongbal-oauth" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }
